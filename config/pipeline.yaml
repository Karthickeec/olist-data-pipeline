# Pipeline defaults. Any leaf can be overridden with an environment variable
# named OLIST__<SECTION>__<KEY>, e.g. OLIST__PG__HOST=db or OLIST__PG__PORT=5433.
# Relative paths are resolved against the repo root.

pg:
  host: localhost
  port: 5432
  dbname: olist
  user: olist
  password: olist
  schema: olist
  pipeline_schema: pipeline  # watermarks and ingest bookkeeping

paths:
  raw_dir: data/raw
  landing_dir: data/landing

customer_changes:
  rate: 0.03        # chance that each of the day's orders produces an address-change request
  dirty_rate: 0.05  # share of requests that are deliberately malformed

lake:
  root: data/lake  # local path (relative to repo root) or a URI such as s3a://bucket/prefix

aws:
  # The only region this project can use: the account is on the AWS Free plan, and its organization's
  # service control policy allows only the project's home region (ap-southeast-2). Other regions are denied.
  region: ap-southeast-2
  bucket_prefix: olist-pipeline   # bucket = <prefix>-<account id>-apse2, resolved at runtime (not committed)
  glue_database: olist_lake
  athena_workgroup: olist
  secret_id: olist/pipeline       # Secrets Manager secret holding pg_password and api_key
  tags:
    project: olist-pipeline

spark:
  master: local[2]
  driver_memory: 2g
  shuffle_partitions: 4
  java_home: ~/.local/share/jdk-17/Contents/Home  # installed by scripts/install_java.sh
  jdbc_package: org.postgresql:postgresql:42.7.7
  jdbc_fetchsize: 10000

api:
  base_url: http://127.0.0.1:8000
  key_env: OLIST_API_KEY      # env var holding the API key (server and client)
  key: ""                     # when set (secret://olist/pipeline#api_key on AWS), the client uses it instead
  page_size: 200
  timeout_seconds: 10
  max_attempts: 5             # per request, then the run fails
  backoff_base_seconds: 0.5   # 0.5, 1, 2, 4 ... (x 0.5-1.0 jitter), unless Retry-After says otherwise
  backoff_max_seconds: 30
  server:                     # failure injection in the mock service
    rate_limit_rate: 0.03     # 429 with Retry-After
    error_rate: 0.02          # 500
    retry_after_seconds: 1
    dirty_rate: 0.01          # malformed records
