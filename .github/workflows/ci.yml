name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.10"
          args: "check"
      - run: ruff format --check

  test:
    runs-on: ubuntu-latest
    # Integration tests use a real Postgres, like docker-compose.yml locally. The Kaggle CSVs aren't in the
    # repo, so the tests that need them skip; AWS is never touched (the AWS code is tested offline).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: olist
          POSTGRES_USER: olist
          POSTGRES_PASSWORD: olist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U olist -d olist"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TZ: UTC   # the configured local JDK path doesn't exist here, so Spark uses setup-java's JAVA_HOME
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Cache Ivy (Spark packages such as the Postgres JDBC driver)
        uses: actions/cache@v6
        with:
          path: ~/.ivy2
          key: ivy-${{ hashFiles('config/pipeline.yaml') }}
      - run: pip install -r requirements.txt -e .
      - run: python -m pytest -q -rs
