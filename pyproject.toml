[project]
name = "olist-pipeline"
version = "0.1.0"
description = "Multi-source e-commerce data pipeline on the Olist dataset"
requires-python = ">=3.11"  # Glue 5.0 runs Python 3.11; local dev uses 3.12

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a running Postgres (skipped when it is unreachable)",
]

[tool.ruff]
line-length = 120
target-version = "py311"      # Glue 5.0 runs Python 3.11
extend-exclude = ["airflow/logs", "data", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["olist_pipeline", "olist_common"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends"]   # FastAPI's parameter declarations
